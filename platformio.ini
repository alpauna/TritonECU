; PlatformIO Project Configuration File
;
; ESP-ECU: Engine Control Unit
;
; Targets:
;   esp32p4_waveshare  — Waveshare ESP32-P4-WIFI6 (ESP32-P4 + ESP32-C6)   [default]
;   freenove_esp32_s3_wroom — original ESP32-S3 board
;
; Both envs use the pioarduino platform fork: the official platformio/espressif32
; is pinned to Arduino core 2.0.17, which predates ESP32-P4 and the 3.x LEDC API
; this codebase now uses.

[platformio]
extra_configs = secrets.ini
default_envs = esp32p4_waveshare

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_type = release

build_flags =
	${secrets.build_flags}
	-D BUILD_ENV_NAME=$PIOENV
	-D _TASK_TIMEOUT
	-D _TASK_STD_FUNCTION
	-D CIRCULAR_BUFFER_INT_SAFE
	-D BOARD_HAS_PSRAM
	-D CONFIG_ASYNC_TCP_USE_WDT=0
	-D DEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=NETWORK_ESP32
	-D _TASK_HEADER_AND_CPP

lib_deps =
	arkhipenko/TaskScheduler@^4.0.0
	rlogiacco/CircularBuffer@^1.4.0
	ESP32Async/ESPAsyncWebServer
	bblanchon/ArduinoJson@^7.4.2
	esp32async/AsyncTCP@^3.4.9
	marvinroger/AsyncMqttClient@^0.9.0
	0xtj/StringStream@^1.0.0
	tobozo/ESP32-targz
	xreef/SimpleFTPServer
	adafruit/Adafruit MCP23017 Arduino Library
	adafruit/Adafruit ADS1X15

; ---------------------------------------------------------------------------
; Waveshare ESP32-P4-WIFI6
;   ESP32-P4NRW32 (dual-core RISC-V, 360 MHz on this rev, 32 MB in-package PSRAM)
;   32 MB NOR flash, onboard ESP32-C6-MINI-1 for Wi-Fi 6 / BLE over SDIO
;   SD card on the native SDMMC slot, not SPI
;
; Silicon on hand reads "ESP32-P4 (revision v1.3)" — pre-rev300, so this uses
; board esp32-p4 (chip_variant esp32p4_es, 360 MHz). If you ever get rev300+
; silicon, switch to esp32-p4_r3 for the 400 MHz clock.
; ---------------------------------------------------------------------------
[env:esp32p4_waveshare]
extends = common
board = esp32-p4
board_build.flash_mode = qio
board_build.partitions = partitions_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 8388608
; CH343 USB-UART bridge (1a86:55d3). Addressed by serial so it cannot collide
; with another ACM device on the same host.
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_*-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_*-if00
debug_tool = esp-builtin
debug_init_break = break setup

build_flags =
	${common.build_flags}
	-D BOARD_ESP32_P4
	-D BOARD_WAVESHARE_P4_WIFI6
	-D ECU_SD_USE_SDMMC
	-D DEST_FS_USES_SD_MMC
	-D DEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD_MMC
	-DCORE_DEBUG_LEVEL=0

lib_deps = ${common.lib_deps}

; ---------------------------------------------------------------------------
; Original ESP32-S3 board — SD card on SPI
; ---------------------------------------------------------------------------
[env:freenove_esp32_s3_wroom]
extends = common
board = freenove_esp32_s3_wroom
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
debug_tool = esp-builtin
debug_init_break = break setup

build_flags =
	${common.build_flags}
	-D BOARD_ESP32_S3_WROOM
	-D ECU_SD_USE_SPI
	-D SD_SPI_SPEED=50
	-D DEST_FS_USES_SD
	-D DEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD
	-DCORE_DEBUG_LEVEL=0
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

lib_deps = ${common.lib_deps}
