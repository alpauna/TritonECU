; POWER board bring-up diagnostic — Nucleo F767ZI
;
; Standalone, deliberately. It is disposable and must not complicate the ECU
; build; the ECU's nucleo env has hard-won OpenOCD settings that are not worth
; sharing a file with.
;
;   pio run -t upload
;   pio device monitor
;
; Wiring, POWER board U7 (2.54 2x5) -> Nucleo:
;   +3.3V ---- 3V3        SCL ------ D15 (PB8)
;   GND ------ GND        SDA ------ D14 (PB9)
;   3.3_ENOUT- D7  (PF13)   <- the protector's own enable
;   5_GOOD --- D4  (PF14)
;   3.3_GOOD - D2  (PF15)
;
; D2/D4/D7 are on EXTI 15/14/13 - different lines, so all three can interrupt
; at once. STM32 shares an EXTI line across ports by PIN NUMBER, so pins that
; look unrelated collide if their numbers match.

[env:nucleo]
platform  = ststm32
board     = nucleo_f767zi
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
