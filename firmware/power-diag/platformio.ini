; POWER board bring-up diagnostic — Nucleo F767ZI
;
; Standalone, deliberately. It is disposable and must not complicate the ECU
; build; the ECU's nucleo env has hard-won OpenOCD settings that are not worth
; sharing a file with.
;
;   pio run -t upload
;   pio device monitor
;
; Wiring, POWER board U7 (2.54 2x5) -> Nucleo:
;   +3.3V ---- 3V3        SCL ------ D15 (PB8)
;   GND ------ GND        SDA ------ D14 (PB9)
;   3.3_ENOUT- D7  (PF13)   <- the protector's own enable
;   5_GOOD --- D4  (PF14)
;   3.3_GOOD - D2  (PF15)
;
; D2/D4/D7 are on EXTI 15/14/13 - different lines, so all three can interrupt
; at once. STM32 shares an EXTI line across ports by PIN NUMBER, so pins that
; look unrelated collide if their numbers match.

[env:nucleo]
platform  = ststm32
board     = nucleo_f767zi
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; An external STLINK-V3 speaks plain SWD and is rejected by the board file's
; "hla" transport ("Debug adapter doesn't support 'hla_swd' transport"), so the
; upload is driven directly. Lifted verbatim from ../ecu/platformio.ini, where
; it was worked out the hard way - including programming the ELF rather than the
; .bin, because a .bin carries no load address and "program firmware.bin"
; reports success while writing nothing.
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32f7x.cfg -c "init; reset halt; program {$BUILD_DIR/${PROGNAME}.elf} verify; reset run; shutdown"
