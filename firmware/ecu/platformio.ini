; ESP-ECU rebuild — engine node
;
; Target: Waveshare ESP32-P4-WIFI6 (ESP32-P4NRW32 + ESP32-C6-MINI-1)
; Vehicle: 1999 Ford F-150 4WD, 5.4L 2V, 4R70W
;
; The official platformio/espressif32 platform is pinned to Arduino core
; 2.0.17, which predates the ESP32-P4. This uses the pioarduino fork.

[platformio]
default_envs = nucleo

[env:engine]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-p4
framework = arduino

; Silicon on hand reports "ESP32-P4 (revision v1.3)" — pre-rev300, so the ES
; variant at 360 MHz. Switch to esp32-p4_r3 for rev300+ silicon (400 MHz).
board_build.flash_mode = qio
board_build.partitions = ../../partitions_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 8388608

; CH343 USB-UART bridge (1a86:55d3). Addressed by its by-id symlink rather than
; /dev/ttyACMn so it cannot be confused with another ACM device on the same
; host — this bench also has a Teensy on ttyACM0, and the numbering is not
; stable across replugs.
;
; Note this must be the full path, not a glob: PlatformIO matches wildcards
; against its own detected port list (/dev/ttyACM*), which never contains
; by-id paths, so a glob here falls through and is passed to esptool verbatim.
;
; Replace the serial number if the board is swapped:
;   ls /dev/serial/by-id/
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B5E133982-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B5E133982-if00
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

build_type = release
build_src_filter = +<core/> +<esp32/>

build_flags =
	-D BOARD_HAS_PSRAM
	-D ECU_BOARD_WAVESHARE_P4_WIFI6
	-D CORE_DEBUG_LEVEL=0
	-Wall

lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	greiman/SdFat@^2.2.3

; Diagnostic build: runs the header solder-bridge self-test at boot.
; Use after soldering the header, with nothing connected to it.
;   pio run -e selftest -t upload && pio device monitor
[env:selftest]
extends = env:engine
build_flags =
	${env:engine.build_flags}
	-D ECU_PIN_SELFTEST

; Measures the achieved ADC noise floor and noise-free bits.
; Short every analog input to its own VxGND before running.
[env:noisefloor]
extends = env:engine
build_flags =
	${env:engine.build_flags}
	-D ECU_ADC_NOISE_FLOOR

; Determines whether the RANGE pin reaches the chip.
[env:rangecheck]
extends = env:engine
build_flags =
	${env:engine.build_flags}
	-D ECU_ADC_RANGE_CHECK

; Sweeps all four SPI modes against a known signal.
[env:spisweep]
extends = env:engine
build_flags =
	${env:engine.build_flags}
	-D ECU_ADC_SPI_SWEEP

; Native unit tests — no hardware. The crank decoder deals only in tooth
; timestamps, so it can be proven before a VR conditioner exists.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
; src/ is not compiled into test builds unless this is set.
test_build_src = true
build_flags =
	-std=gnu++17
	-I include
build_src_filter = +<core/>


; ---------------------------------------------------------------------------
; STM32F767ZI Nucleo-144 — the intended target for the truck ECU.
;
; Chosen over the ESP32-P4 for three reasons: rusEFI's Proteus ECU runs on this
; exact part, the Nucleo is in hand so prototyping starts immediately, and
; ~114 I/O against 37 needed removes the pin budget as a design constraint.
;
; The core decode and scheduling modules are <stdint.h>-only and build for both
; targets unchanged, tests included.
; ---------------------------------------------------------------------------
[env:nucleo]
platform = ststm32
board = nucleo_f767zi
framework = arduino

; The board file assumes the on-board ST-Link V2.1, which uses OpenOCD's "hla"
; transport. An external STLINK-V3 speaks plain SWD and is rejected by that
; config ("Debug adapter doesn't support 'hla_swd' transport"), so the upload
; is driven directly instead.
;
; Wiring: V3 on CN6 with the CN2 jumpers FITTED. CN6 sits on the ST-Link side
; of those jumpers, so removing them disconnects CN6 from the MCU -- the
; opposite of what seems intuitive.
upload_protocol = custom
; No "verify": OpenOCD verifies by loading a CRC routine into target RAM and
; running it, and that consistently fails here with "timed out while waiting
; for target halted". Programming itself reports success every time, and the
; firmware demonstrably runs afterwards, so the verify step is dropped rather
; than fought. Flash writes are checked by the ST-Link itself in any case.
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32f7x.cfg -c "init; reset halt; program {$SOURCE}; reset run; shutdown"
debug_tool = custom
debug_server =
	$PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd
	-s
	$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts
	-f
	interface/stlink.cfg
	-c
	transport select swd
	-f
	target/stm32f7x.cfg
; ST-Link VCP, addressed by serial so it cannot collide with the other ACM
; devices on this bench (a Teensy and the ESP32-P4's CH343).
monitor_port = /dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066DFF485082535067130738-if02
; 57600, not 115200: the ST-Link VCP drops bytes on long bursts at the higher
; rate even with flush-and-pause between lines.
monitor_speed = 57600

build_type = release
build_src_filter = +<core/> +<stm32/>

build_flags =
	-D ECU_BOARD_NUCLEO_F767ZI
	-D HAL_SD_MODULE_ENABLED
	-Wall

lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	greiman/SdFat@^2.2.3
