; Latching relay driver — ATtiny202 (tinyAVR 0-series, UPDI)
;
; UPDI wants nothing but a USB-serial adapter and a 4.7k resistor between its TX
; and RX, with RX to the UPDI pin. If PlatformIO cannot find the board, install
; megaTinyCore and follow its PlatformIO note — the core supplies these boards.
;
;   pio run                  build
;   pio run -t upload        flash over UPDI
;   pio run -t fuses         write the fuses, INCLUDING the BOD level
;
; The [env:attiny85] below is the same firmware on a classic ISP part — the one
; already sitting in the oil pressure board's parts drawer. Pick an env with
; `pio run -e attiny85`.

[env:attiny202]
platform = atmelmegaavr
board = ATtiny202
framework = arduino

; 5 MHz is the 20 MHz internal oscillator divided by 4. Nothing here is
; timing-critical — the coil pulse is 30 ms — and a slower clock is quieter and
; happier at 5 V.
board_build.f_cpu = 5000000L

; THE BROWN-OUT INTERLOCK IS THIS LINE, not code. Below 4.3 V the part stops,
; so it cannot emit a half-length pulse and leave the armature stranded between
; positions. Verify the key name against megaTinyCore's PlatformIO docs before
; relying on it, and confirm with `pio run -t fuses`.
board_hardware.bod = 4.3v

upload_protocol = serialupdi
upload_speed = 115200

build_flags =
	-Wall
	-Wextra

; ---------------------------------------------------------------------------
; ATtiny85-20SU on an ISP programmer. Same source; src/main.cpp switches its own
; pin defines on __AVR_ATtiny85__, so nothing else changes.
;
;   pio run -e attiny85 -t upload
;   pio run -e attiny85 -t fuses
;
; Needs ATTinyCore: `pio pkg install -g -p atmelavr` then add the core per its
; PlatformIO note. Check the board_hardware keys against ATTinyCore's docs —
; they differ from megaTinyCore's.
; ---------------------------------------------------------------------------
[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; 8 MHz internal. No crystal, and nothing here is timing-critical.
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal

; Same 4.3 V brown-out as the 202 — the tiny85's BODLEVEL fuse offers exactly
; 1.8 / 2.7 / 4.3, so the interlock ports across unchanged.
board_hardware.bod = 4.3v

; usbasp, or stk500v1 for an Arduino-as-ISP
upload_protocol = usbasp

build_flags =
	-Wall
	-Wextra
