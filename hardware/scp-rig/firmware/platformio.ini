; SCP capture rig — Phase 0 stage 1: edge capture and pulse histogram.
;
; Same platform and core as hardware/vr-test-rig/firmware: Max Gerhardt's fork
; with the earlephilhower core, because it is built on the Pico SDK, so
; hardware/pio.h and hardware/pwm.h are reachable directly.
;
;   pio run -t upload                  VEHICLE image (default): GP3 is an input
;   pio run -e pico_loopback -t upload BENCH image: GP3 drives the loopback
;   ../tools/read-rig.py               watch the histogram (pio device monitor
;                                      does not raise DTR; the rig stays silent)
;
; Every report prints mode=VEHICLE or mode=LOOPBACK. Read it before the DLC.
;
; LOOPBACK SELF-TEST: the board's bench straps (R7, H3, SCP- to 3V3 via 220k)
; feed GP3 back through the comparator to GP2. Clusters at 8.06 and 15.88 us
; pass - see ../README.md, Build order 2. Nothing else proves the chain.

[platformio]
; Only the vehicle image unless asked. Without this, a bare `pio run -t upload`
; flashes every environment in turn and the LAST one - loopback - is what runs.
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

build_flags =
	-Wall
	-Wextra
	-Iinclude

monitor_speed = 115200

; Bench only. Drives GP3; never take this image to a vehicle.
[env:pico_loopback]
extends     = env:pico
build_flags = ${env:pico.build_flags} -DLOOPBACK=1
