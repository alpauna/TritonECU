; SCP capture rig — Phase 0 stage 1: edge capture and pulse histogram.
;
; Same platform and core as hardware/vr-test-rig/firmware: Max Gerhardt's fork
; with the earlephilhower core, because it is built on the Pico SDK, so
; hardware/pio.h and hardware/pwm.h are reachable directly.
;
;   pio run                     build
;   pio run -t upload           flash (hold BOOTSEL on the first one)
;   pio device monitor          watch the histogram
;
; LOOPBACK SELF-TEST: jumper GP3 to GP2 and the rig measures its own generated
; signal. Two clusters at 8.00 and 16.00 us means the whole chain — PIO timing,
; count-to-ns conversion, histogram — is right. Nothing else proves that.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

build_flags =
	-Wall
	-Wextra
	-Iinclude

monitor_speed = 115200
