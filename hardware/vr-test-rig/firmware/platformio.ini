; VR rig step generator — RP2040
;
; The official platformio/raspberrypi platform carries only the Arduino Mbed
; core. This uses Max Gerhardt's fork with the earlephilhower core, which is
; built on the Pico SDK — so hardware/pio.h and friends are reachable directly,
; and core 1 arrives as setup1()/loop1() rather than multicore_launch_core1().
;
;   pio run -t upload        (hold BOOTSEL on first flash)
;   pio device monitor

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; USB CDC for commands. The UART pins stay free.
build_flags =
	-Wall
	-Wextra

monitor_speed = 115200
monitor_port = /dev/ttyACM0
