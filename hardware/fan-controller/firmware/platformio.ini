; Enclosure fan controller — ATtiny1614 (tinyAVR 1-series, UPDI)
;
; UPDI needs nothing but a USB-serial adapter and a 4.7k between its TX and RX,
; with RX to the UPDI pin. Same rig as ../../latching-relay/firmware.
;
;   pio run                  build
;   pio run -t upload        flash over UPDI
;   pio run -t fuses         write the fuses, INCLUDING the BOD level
;
; WHY NOT THE ATtiny202 used elsewhere in this repo: 2 KB of flash. The SSD1306
; driver and its font spend most of that before any of this code exists. Without
; a display the 202 is the right part; with one it is not.

[env:attiny1614]
platform  = atmelmegaavr
board     = ATtiny1614
framework = arduino

; 5 MHz — 20 MHz internal divided by 4. Nothing here is timing-critical: the
; plant is a box of air. A slower clock wakes, converts and sleeps on less
; energy, and energy on this board is measured as temperature error.
board_build.f_cpu = 5000000L

; THE SENSOR-FAULT INTERLOCK IS PARTLY THIS LINE. Below the BOD level the part
; stops rather than running the comparison on a conversion taken against a
; sagging reference. "4.3v" is PlatformIO's key; it writes BODCFG = 0xF4, which
; the datasheet calls BODLEVEL7: 4.2 V typical, 3.9-4.5 V across parts.
; Written and verified on the bench board 2026-09-30.
board_hardware.bod = 4.3v

upload_protocol = serialupdi
upload_speed    = 115200

; Small, ATtiny-targeted SSD1306 driver. Adafruit_SSD1306 does not fit.
lib_deps = https://github.com/datacute/Tiny4kOLED

build_flags =
	-Wall
	-Wextra

; v2 board: 3/4-wire fan, PWM on PB2, tach on PA5, fan type detected at boot.
; Flash with: pio run -e attiny1614_v2 -t upload   (then -t fuses)
; The v2 board carries an ATtiny1616-MNR (VQFN-20, 3x3 mm) - cheaper and
; smaller than the 1614, same die family: identical Table 5-1 pin functions, so
; no pin moves in the firmware. The name stays attiny1614_v2 for the commands
; already written down; a bodged v1 board uses attiny1614_v2_bench below.
[env:attiny1614_v2]
extends     = env:attiny1614
board       = ATtiny1616
build_flags = ${env:attiny1614.build_flags} -DFAN_HW_V2

; The README's bench path: v2 firmware on a v1 board (ATtiny1614) with PB2 and
; PA5 bodged out. Same code as attiny1614_v2, built for the SOIC part.
[env:attiny1614_v2_bench]
extends     = env:attiny1614
build_flags = ${env:attiny1614.build_flags} -DFAN_HW_V2
